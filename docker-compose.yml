name: markets
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${PG_USER?PG_USER не задан в .env}
      POSTGRES_PASSWORD: ${PG_PASSWORD?PG_PASSWORD не задан в .env}
      POSTGRES_DB: ${PG_DB?PG_DB не задан в .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5433:5432"
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  pgdata:
